[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-bot"
version = "1.1.0"
description = "Branch-aware employee operations platform with Arabic web portal and optional Telegram integration"
requires-python = ">=3.11,<4"
dependencies = [
    "psycopg2-binary>=2.9.11,<3",
    "python-telegram-bot[webhooks,job-queue]>=22.5,<23",
    "python-dotenv>=1.1,<2",
    "Flask>=3.1,<4",
    "gunicorn>=23,<24",
    "tzdata>=2025.2",
]

[tool.setuptools]
py-modules = ["bot", "branch_settings", "request_types", "broadcast", "web_app", "web_admin_extensions"]

[tool.setuptools.packages.find]
include = ["scripts*"]
