name: Python checks

on:
  push:
    branches: ["main", "improvements/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: employee_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d employee_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/employee_bot_test
      DATABASE_SSLMODE: disable
      TELEGRAM_BOT_TOKEN: ci-test-token-not-valid-for-telegram
      SUPER_ADMIN_TELEGRAM_ID: "123456789"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install .
      - name: Validate Render database bootstrap
        run: python -m scripts.bootstrap
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
