# Web-first deployment: no Telegram token is required to launch the employee portal.
# Telegram worker code remains in the repository and can be added later as a separate service.
services:
  - type: web
    name: employee-web-portal
    runtime: python
    branch: main
    plan: starter
    region: frankfurt
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install .
    preDeployCommand: python -m scripts.bootstrap
    startCommand: gunicorn --workers 2 --threads 12 --timeout 60 --access-logfile - --error-logfile - web_app:app
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: employee-bot-db
          property: connectionString
      - key: DATABASE_SSLMODE
        value: prefer
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_BOOTSTRAP_TOKEN
        sync: false

databases:
  - name: employee-bot-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    databaseName: employee_bot
    user: employee_bot
    ipAllowList: []
